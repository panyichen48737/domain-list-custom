      - name: Generate cn
        run: |
          cat ./publish/cn.txt | perl -ne '/^(domain):([^:]+)(\n$|:@.+)/ && print "$2\n"' > ./tmp/temp-cn-suffix.txt
          cat ./tmp/src/cn1 | awk '/^DOMAIN-SUFFIX,/' | sed 's/DOMAIN-SUFFIX,//' >> ./tmp/temp-cn-suffix.txt
          cat ./tmp/src/cn | awk '/^DOMAIN-SUFFIX,/' | sed 's/DOMAIN-SUFFIX,//' >> ./tmp/temp-cn-suffix.txt
          cat ./tmp/src/cn2 | perl -ne '/server=\/([^\/]+)/ && print "$1\n"' >> ./tmp/temp-cn-suffix.txt
          sort --ignore-case -u ./tmp/temp-cn-suffix.txt > ./tmp/cn-suffix.txt

          cat ./publish/cn.txt | perl -ne '/^(full):([^:]+)(\n$|:@.+)/ && print "DOMAIN,$2\n"' > ./tmp/temp-cn-other.txt
          cat ./tmp/src/cn1 | awk '/^DOMAIN,/' >> ./tmp/temp-cn-other.txt
          cat ./tmp/src/cn | awk '/^DOMAIN,/' >> ./tmp/temp-cn-other.txt
          sort --ignore-case -u ./tmp/temp-cn-other.txt > ./tmp/cn-other.txt

      - name: Generate cn-lite
        run: |
          cat ./publish/cn.txt | perl -ne '/^(domain):([^:]+)(\n$|:@.+)/ && print "$2\n"' > ./tmp/temp-cn-lite-suffix.txt
          cat ./tmp/src/cn1 | awk '/^DOMAIN-SUFFIX,/' | sed 's/DOMAIN-SUFFIX,//' >> ./tmp/temp-cn-lite-suffix.txt
          sort --ignore-case -u ./tmp/temp-cn-lite-suffix.txt > ./tmp/cn-lite-suffix.txt

          cat ./publish/cn.txt | perl -ne '/^(full):([^:]+)(\n$|:@.+)/ && print "DOMAIN,$2\n"' > ./tmp/temp-cn-lite-other.txt
          cat ./tmp/src/cn1 | awk '/^DOMAIN,/' >> ./tmp/temp-cn-lite-other.txt
          sort --ignore-case -u ./tmp/temp-cn-lite-other.txt > ./tmp/cn-lite-other.txt

      - name: Remove redundant domains
        run: |
          chmod +x ./tools/*.py ./tools/filter.sh
          archs=(fakeip-filter private microsoft-cn bing onedrive apple-proxy apple-cn google-cn games-cn netflix disney hbo primevideo appletv youtube tiktok bilibili spotify games ai networktest tld-proxy tld-cn proxy cn cn-lite)
          for arch in "${archs[@]}"; do
            python ./tools/findRedundantDomain.py "./tmp/${arch}-suffix.txt" "./tmp/${arch}-deleted-unsort-suffix.txt"
            [ ! -f "./tmp/${arch}-deleted-unsort-suffix.txt" ] && touch "./tmp/${arch}-deleted-unsort-suffix.txt"
            sort --ignore-case "./tmp/${arch}-deleted-unsort-suffix.txt" > "./tmp/${arch}-deleted-sort-suffix.txt"
            python ./tools/removeFrom.py -remove "./tmp/${arch}-deleted-sort-suffix.txt" -from "./tmp/${arch}-suffix.txt" -out "./tmp/none-redundant-${arch}-suffix.txt"
            cat "./tmp/none-redundant-${arch}-suffix.txt" | sed 's/^/DOMAIN-SUFFIX,/' > "./tmp/done-${arch}-suffix.txt"
            cat "./tmp/${arch}-other.txt" "./tmp/done-${arch}-suffix.txt" | sort --ignore-case -u > "./tmp/${arch}-redundant.txt"

            ./tools/filter.sh "./tmp/${arch}-redundant.txt" > "./domains/${arch}.list"
          done

          # `proxy` and `cn` are the two base lists, one sending its domains
          # through the proxy and the other direct, so a rule they share is
          # decided by whichever of the two a config happens to order first.
          # The catch-all `cn` and `cn-lite` give up every rule `proxy` also
          # has. Only word-for-word equal rules are dropped: both sides are
          # built from their own sources, and where those sources disagree
          # about a domain beyond the shared one, that is a disagreement about
          # the domain itself rather than something to settle here.
          excludes=(proxy:cn proxy:cn-lite)
          for pair in "${excludes[@]}"; do
            from=${pair%%:*}
            to=${pair##*:}
            awk 'NR==FNR{a[$0]; next} !($0 in a)' "./domains/${from}.list" "./domains/${to}.list" > "./tmp/temp-${to}.list"
            mv -f "./tmp/temp-${to}.list" "./domains/${to}.list"
          done

          # `games` is the proxy list and `games-cn` the direct one, so a game
          # they both carry would be sent whichever way the config orders them.
          # The same subtraction is done here, at the end, rather than while
          # `games` is assembled: `games-cn` is built from the very sources
          # `games` draws on, but it is deduplicated on the way, so a rule can
          # be missing from it as a narrower form of one it kept, and comparing
          # the two finished lists is the only way to see that. So `games`
          # gives up a rule when `games-cn` already matches everything it
          # matches: the same rule, or -- for the `DOMAIN` and `DOMAIN-SUFFIX`
          # types, where one covers a whole branch -- a shorter suffix of it.
          awk -F, 'NR==FNR { seen[$0]; if ($1=="DOMAIN-SUFFIX") suf[$2]; next }
                   $0 in seen { next }
                   $1=="DOMAIN" && $2 in suf { next }
                   $1=="DOMAIN-SUFFIX" {
                     n=split($2, a, ".")
                     for (i=2; i<=n; i++) { q=a[i]; for (j=i+1; j<=n; j++) q=q"."a[j]; if (q in suf) next }
                   }
                   { print }' ./domains/games-cn.list ./domains/games.list > ./tmp/temp-games.list
          mv -f ./tmp/temp-games.list ./domains/games.list

          # `apple-proxy` and `appletv` are the Apple domains that need a proxy,
          # so neither may appear in `apple-cn`. The exact-line pass drops what
          # the two files share word for word, such as PROCESS-NAME,LookupViewService.
          cat ./domains/apple-proxy.list ./domains/appletv.list > ./tmp/apple-proxied.list

          awk 'NR==FNR{a[$0]; next} !($0 in a)' ./tmp/apple-proxied.list ./domains/apple-cn.list > ./tmp/temp-apple-cn.list

          # The exact-line pass cannot see the two ways `apple-cn` still
          # overlaps what is proxied. A `DOMAIN-KEYWORD` such as `testflight`
          # matches a proxied `DOMAIN,testflight.apple.com`, so every keyword
          # that occurs inside a proxied domain is dropped. And a `DOMAIN` such
          # as `apps.apple.com` sits under a proxied `DOMAIN-SUFFIX,apps.apple.com`,
          # so a rule is dropped when any of its own parent suffixes is one of
          # the proxied suffixes, walking the labels from the second one on so
          # that a value never covers itself. Rules of other types are printed
          # through untouched.
          awk -F, 'NR==FNR { if ($1=="DOMAIN" || $1=="DOMAIN-SUFFIX") { p[$2]; if ($1=="DOMAIN-SUFFIX") suf[$2] } next }
                   $1=="DOMAIN-KEYWORD" { for (d in p) if (index(d,$2)) next }
                   ($1=="DOMAIN" || $1=="DOMAIN-SUFFIX") {
                     n=split($2, a, ".")
                     for (i=2; i<=n; i++) { q=a[i]; for (j=i+1; j<=n; j++) q=q"."a[j]; if (q in suf) next }
                   }
                   { print }' ./tmp/apple-proxied.list ./tmp/temp-apple-cn.list > ./domains/apple-cn.list

          cat ./domains/onedrive.list ./domains/bing.list ./domains/ai.list > ./tmp/exclude.list
          awk 'FNR==NR {a[$0]; next} !($0 in a)' ./tmp/exclude.list ./domains/microsoft-cn.list > ./tmp/temp-microsoft-cn.list
          mv -f ./tmp/temp-microsoft-cn.list ./domains/microsoft-cn.list

          rm -rf ./tmp* ./publish*

      # Compares this build against what this repository published last time.
      # Both questions are answered from that published copy:
      #
      #   * Did a list lose a large part of its content? That is what a silently
      #     broken upstream source, or a bug in the generator, looks like. It
      #     stops the run instead of being published.
      #   * Is the content identical to last time? Then the push has nothing to
      #     do and is skipped. The release is refreshed either way, so the date
      #     in its body stays a sign that the pipeline is alive.
      - name: Compare with the published lists
        id: compare
        run: |
          published="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/domains"
          # A list that loses, or gains, more than this share of its lines is
          # treated as broken: a large drop means a source or a step produced
          # nothing, a large jump means one started matching far too much.
          # Raise them if upstream ever changes a source size on purpose.
          max_shrink_percent=50
          max_grow_percent=50
          # Below this size the percentages are noise: half of an 8-line list is
          # 4 lines, which upstream adds or drops without anything being wrong.
          min_lines=50
          workdir=$(mktemp -d)
          broken=0

          for path in ./domains/*.list; do
            name=$(basename "$path")
            new_lines=$(wc -l < "$path")

            # An empty list means a source or a step produced nothing. That is
            # wrong whatever the previous build held, so it is checked before
            # the comparison below, which skips lists with no published copy.
            if [ "$new_lines" -eq 0 ]; then
              echo "::error file=domains/${name}::${name} is empty"
              broken=1
              continue
            fi

            if curl -fsSL --max-time 60 "$published/${name}" -o "${workdir}/previous" 2>/dev/null; then
              old_lines=$(wc -l < "${workdir}/previous")
            else
              # First run, a list that was just added, or the branch is not
              # readable. Nothing to compare against, so nothing to check.
              echo "${name}: no published copy to compare with, skipping the check"
              continue
            fi

            floor=$(( old_lines * (100 - max_shrink_percent) / 100 ))
            if [ "$old_lines" -ge "$min_lines" ] && [ "$new_lines" -lt "$floor" ]; then
              echo "::error file=domains/${name}::${name} shrank from ${old_lines} to ${new_lines} lines, over ${max_shrink_percent}%"
              broken=1
            fi
            ceiling=$(( old_lines * (100 + max_grow_percent) / 100 ))
            if [ "$old_lines" -ge "$min_lines" ] && [ "$new_lines" -gt "$ceiling" ]; then
              echo "::error file=domains/${name}::${name} grew from ${old_lines} to ${new_lines} lines, over ${max_grow_percent}%"
              broken=1
            fi
            echo "${name}: ${old_lines} -> ${new_lines} lines"
          done

          rm -rf "$workdir"
          if [ "$broken" -ne 0 ]; then
            exit 1
          fi

          # Digest of everything that is about to be published. The `*.list`
          # glob keeps this file out of its own input. It is committed along
          # with the branch so that the next run can read it back.
          hash=$(cd ./domains && LC_ALL=C sha256sum *.list | sha256sum | cut -d' ' -f1)
          printf '%s\n' "$hash" > ./domains/.content-sha256

          # Empty when the file is not on the branch yet, which compares unequal
          # below and so lets the push run.
          previous=$(curl -fsSL --max-time 60 "$published/.content-sha256" 2>/dev/null | tr -d '[:space:]')

          if [ -n "$previous" ] && [ "$previous" = "$hash" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "content is identical to the published one, the push will be skipped"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "content differs from the published one, the push will run"
          fi

      - name: Release and upload `domains` assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: domains
          tag: domains
          overwrite: true
          body: |
            供下游项目 [panyichen48737/ruleset_geodata](https://github.com/panyichen48737/ruleset_geodata) 使用的 DOMAIN 数据源文件
            文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./domains/*

      # Skipped when the content did not change: a force-push of the same files
      # only churns the branch and wakes up whatever watches it. The release
      # above has already been refreshed at that point.
      - name: Git push assets to `domains` branch
        if: steps.compare.outputs.unchanged != 'true'
        run: |
          cd ./domains/ || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b domains
          git add . && git commit -m "DOMAIN 数据源文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin domains

     
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
