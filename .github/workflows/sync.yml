name: Upstream Sync

permissions:
  contents: write

on:
  # 本仓库的 build.yml / tools 相对上游深度定制（27 个列表、games 的覆盖相减、cn 的逐字
  # 相减等），自动 merge 会把上游对这些文件的改动直接带进来——其中无冲突标记的那些不会
  # 报错、只会静默覆盖。因此取消定时同步，改为需要时手动触发，合并前先 review。
  # 注意这条 sync 只带代码：build.yml 的数据源全部是运行时从第三方 raw 拉的
  # （blackmatrix7 / felixonmars / XIU2 …），从不读 DustinWin/domain-list-custom，
  # 所以取消定时不会让任何列表数据变旧。
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: DustinWin/domain-list-custom
          upstream_sync_branch: main
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 由于上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次。"
          exit 1
